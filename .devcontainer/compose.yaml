services:
  devcontainer:
    # 镜像引用参数化：默认即上游镜像，fork 者可在 .devcontainer/.env 设 DOCKERHUB_USERNAME/IMAGE_NAME。
    # 发布契约见 docs/adr/0001-image-release-contract.md（默认消费 Latest Pointer :latest）。
    # IMAGE_TAG 默认 latest（每次 rebuild 自动拉到最新基线）；pin 到具体版本时在 .env 设 IMAGE_TAG=vX.Y.Z。
    image: ${DOCKERHUB_USERNAME:-xiao806852034}/${IMAGE_NAME:-ai-dev-container}:${IMAGE_TAG:-latest}
    # 不在此处用 pull_policy: always —— VS Code 生成临时 compose 时会把 image 改写成本地派生镜像引用，
    # 该策略会去 registry 拉一个本地名而失败。改用 devcontainer.json 的 initializeCommand 在宿主侧、
    # rebuild 前拉取上游 :latest（仅 latest，pin 版本跳过），见 .devcontainer/pull-image.sh。
    volumes:
      - ..:/home/vscode/workspace

      - ${WSL_HOME:-dev-home}:/home/vscode/wsl-home:cached

      # 统一缓存目录
      - dev-cache:/home/vscode/.cache-volumes

    ports:
      # HAPI Local Hub：仅绑定宿主机回环（Host Tunnel Port）。
      # 模板自身不把 HAPI 暴露到 LAN/公网；公开访问需用户自行在宿主侧
      # 配置 Cloudflare Tunnel 等隧道软件。
      - "127.0.0.1:3006:3006"

    # 保持容器运行
    command: sleep infinity

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  # AI agent 配置存储
  dev-home:
    name: dev-home
  # 统一缓存存储
  dev-cache:
    name: dev-cache
