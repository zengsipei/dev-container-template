services:
  devcontainer:
    image: xiao806852034/ai-dev-container:latest
    # pull_policy: always # 此处有 bug，VS Code 生成临时 compose 文件，把 image 指向这个本地镜像，然后远程没有
    volumes:
      - ..:/home/vscode/workspace

      - ${WSL_HOME:-dev-home}:/home/vscode/wsl-home:cached

      # 统一缓存目录
      - dev-cache:/home/vscode/.cache-volumes

    ports:
      # HAPI Local Hub：仅绑定宿主机回环（Host Tunnel Port）。
      # 模板自身不把 HAPI 暴露到 LAN/公网；公开访问需用户自行在宿主侧
      # 配置 Cloudflare Tunnel 等隧道软件。
      - "127.0.0.1:3006:3006"

    # 保持容器运行
    command: sleep infinity

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  # AI agent 配置存储
  dev-home:
    name: dev-home
  # 统一缓存存储
  dev-cache:
    name: dev-cache
