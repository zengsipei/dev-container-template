services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/home/vscode/workspace

      - ${WSL_HOME:-dev-home}:/home/vscode/wsl-home:cached

      # 统一缓存目录
      - dev-cache:/home/vscode/.cache-volumes

    # 保持容器运行
    command: sleep infinity

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  # AI agent 配置存储
  dev-home:
  # 统一缓存存储
  dev-cache:
