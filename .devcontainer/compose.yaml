services:
  devcontainer:
    # 镜像引用参数化：默认即上游镜像，fork 者可在 .devcontainer/.env 设 DOCKERHUB_USERNAME/IMAGE_NAME。
    # 发布契约见 docs/adr/0001-image-release-contract.md（默认消费 Latest Pointer :latest）。
    image: ${DOCKERHUB_USERNAME:-xiao806852034}/${IMAGE_NAME:-ai-dev-container}:latest
    # pull_policy: always # 已知 bug（见 ADR 0001「已知缺口」/ follow-up issue）：VS Code 生成临时 compose 文件把 image 指向本地镜像，远程拉不到
    volumes:
      - ..:/home/vscode/workspace

      - ${WSL_HOME:-dev-home}:/home/vscode/wsl-home:cached

      # 统一缓存目录
      - dev-cache:/home/vscode/.cache-volumes

    ports:
      # HAPI Local Hub：仅绑定宿主机回环（Host Tunnel Port）。
      # 模板自身不把 HAPI 暴露到 LAN/公网；公开访问需用户自行在宿主侧
      # 配置 Cloudflare Tunnel 等隧道软件。
      - "127.0.0.1:3006:3006"

    # 保持容器运行
    command: sleep infinity

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  # AI agent 配置存储
  dev-home:
    name: dev-home
  # 统一缓存存储
  dev-cache:
    name: dev-cache
